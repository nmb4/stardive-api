                        'fade-up': 'fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },

                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        glowShift: {
                            '0%': { opacity: 0.2, transform: 'scale(1)' },
                            '100%': { opacity: 0.5, transform: 'scale(1.2)' },
                        },
                        fadeUp: {
                            '0%': { opacity: 0, transform: 'translateY(15px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }

            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('stardive_api_url') || 'https://api.stardive.space');

            const normalizeServerFile = (file) => ({
                ...file,
                name: file.name || file.original_name || 'unnamed-file',
                size_bytes: file.size_bytes ?? file.size ?? 0,
                mime_type: file.mime_type || 'application/octet-stream',
            });

            const normalizeServerFileList = (payload) => {
                const rawFiles = Array.isArray(payload) ? payload : (payload?.files || []);
                return rawFiles.map(normalizeServerFile);
            };

            const verifyHealthAndFetch = async () => {
                setLoading(true);
                
                if (useSimulated) {
                    // Seed sandbox local storage database if empty
                    const stored = localStorage.getItem('stardive_mock_files');
                    if (!stored) {
                        localStorage.setItem('stardive_mock_files', JSON.stringify(DEMO_FILES));

                        setFiles(JSON.parse(stored));
                    }
                    setApiStatus('demo');
                    setApiHealth({ up: true, error: null, checkedAt: new Date().toLocaleTimeString() });
                    setLoading(false);
                    return;
                }

                try {
                    // Try to fetch either /up or /v1/health or /health
                    const headers = {};
                    if (apiKey) {
                        headers['Authorization'] = `Bearer ${apiKey}`;
                    }

                    // Perform a concurrent check of /up and /v1/health
                    const healthUrl = `${apiUrl}/up`;
                    const upCheck = await fetch(healthUrl, { method: 'GET', headers }).catch(() => null);

                    if (upCheck && upCheck.ok) {
                        setApiHealth({ up: true, error: null, checkedAt: new Date().toLocaleTimeString() });
                        setApiStatus('online');
                        await fetchFileList();
                    } else {
                        // Fallback check to /v1/health as listed in endpoints config
                        const altHealthUrl = `${apiUrl}/v1/health`;
                        const altCheck = await fetch(altHealthUrl, { method: 'GET', headers }).catch(() => null);
                        if (altCheck && altCheck.ok) {
                            setApiHealth({ up: true, error: null, checkedAt: new Date().toLocaleTimeString() });
                            setApiStatus('online');
                            await fetchFileList();
                        } else {
                            throw new Error("Endpoint reached but status returned invalid response code.");
                        }
                    }
                } catch (err) {
                    setApiHealth({ up: false, error: err.message || "Failed connection", checkedAt: new Date().toLocaleTimeString() });
                    setApiStatus('offline');
                    // Automatically fallback to Mock environment to maintain smooth interface usability
                    const stored = localStorage.getItem('stardive_mock_files') || JSON.stringify(DEMO_FILES);
                    setFiles(JSON.parse(stored));
                    triggerToast("Using Offline Local Sandbox state.", "warning");
                } finally {
                    setLoading(false);
                }
            };

            // Fetch list of files from server
            const fetchFileList = async () => {
                if (useSimulated) {
                    const stored = JSON.parse(localStorage.getItem('stardive_mock_files') || JSON.stringify(DEMO_FILES));
                    setFiles(stored);
                    return;
                }

                try {
                    const headers = {};
                    if (apiKey) {
                        headers['Authorization'] = `Bearer ${apiKey}`;
                    }
                    const res = await fetch(`${apiUrl}/v1/files`, { headers });
                    if (!res.ok) throw new Error(`HTTP error status: ${res.status}`);
                    const data = await res.json();
                    
                    // stardive-api returns { files: [{ id, original_name, size, mime_type, ... }] }.
                    // Normalize it to the shape the UI was generated around.
                    setFiles(normalizeServerFileList(data));
                } catch (err) {
                    triggerToast(`Failed to load server files: ${err.message}`, "error");
                }
            };

            // Custom UI file uploader handler
            const handleFileUpload = async (event, replacementId = null) => {
                const targetFiles = event.target.files;
                if (!targetFiles || targetFiles.length === 0) return;
                const file = targetFiles[0];

                setUploading(true);
                setUploadProgress(10);

                if (useSimulated || apiStatus === 'offline') {
                    // Simulate high-fidelity upload delay and local persistence
                    const interval = setInterval(() => {
                        setUploadProgress(prev => {
                            if (prev >= 90) {
                                clearInterval(interval);
                                return 90;
                            }
                            return prev + 25;
                        });
                    }, 150);

                    setTimeout(() => {
                        clearInterval(interval);
                        setUploadProgress(100);

                        const currentMock = JSON.parse(localStorage.getItem('stardive_mock_files') || JSON.stringify(DEMO_FILES));
                        
                        if (replacementId) {
                            // PUT replace logic
                            const updated = currentMock.map(item => {
                                if (item.id === replacementId) {
                                    return {
                                        ...item,
                                        name: file.name,
                                        mime_type: file.type || "application/octet-stream",
                                        size_bytes: file.size,
                                        created_at: new Date().toISOString(),
                                        url: file.type.startsWith('image/') ? URL.createObjectURL(file) : null,
                                        content: "Simulated updated binary byte-buffer."
                                    };
                                }
                                return item;
                            });
                            localStorage.setItem('stardive_mock_files', JSON.stringify(updated));
                            setFiles(updated);
                            triggerToast(`File replaced: ${file.name}`, "success");
                            // Update dynamic drawer if selected
                            if (selectedFile && selectedFile.id === replacementId) {
                                setSelectedFile(updated.find(f => f.id === replacementId));
                            }
                        } else {
                            // POST upload logic
                            const newId = `file-${Math.random().toString(36).substring(2, 6)}`;
                            const isImg = file.type.startsWith('image/');
                            const newMockFile = {
                                id: newId,
                                name: file.name,
                                mime_type: file.type || 'application/octet-stream',
                                size_bytes: file.size,
                                created_at: new Date().toISOString(),
                                url: isImg ? URL.createObjectURL(file) : null,
                                content: isImg ? null : `Plaintext buffer view of ${file.name}. Raw size: ${file.size} bytes.`
                            };
                            
                            const updated = [newMockFile, ...currentMock];
                            localStorage.setItem('stardive_mock_files', JSON.stringify(updated));
                            setFiles(updated);
                            triggerToast(`Uploaded successfully: ${file.name}`, "success");
                        }

                        setUploading(false);
                        setUploadProgress(0);
                        setReplaceTargetId(null);
                    }, 1200);

                    return;
                }

                // Production Real Backend Call
                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const headers = {};
                    if (apiKey) {
                        headers['Authorization'] = `Bearer ${apiKey}`;
                    }

                    let response;
                    setUploadProgress(40);
                    
                    if (replacementId) {
                        // PUT /v1/files/{id}
                        response = await fetch(`${apiUrl}/v1/files/${replacementId}`, {
                            method: 'PUT',
                            headers,
                            body: formData
                        });
                    } else {
                        // POST /v1/files
                        response = await fetch(`${apiUrl}/v1/files`, {
                            method: 'POST',
                            headers,
                            body: formData
                        });
                    }

                    setUploadProgress(80);

                    if (!response.ok) {
                        throw new Error(`Upload returned status ${response.status}: ${response.statusText}`);
                    }

                    setUploadProgress(100);
                    triggerToast(replacementId ? `Replaced ${file.name} successfully!` : `Uploaded ${file.name} successfully!`, "success");

                    const payload = await response.json().catch(() => null);
                    if (payload?.file) {
                        const savedFile = normalizeServerFile(payload.file);
                        setFiles(current => {
                            if (replacementId) {
                                return current.map(item => item.id === replacementId ? savedFile : item);
                            }
                            return [savedFile, ...current.filter(item => item.id !== savedFile.id)];
                        });
                    }

                    await fetchFileList();
                    
                    if (replacementId && selectedFile?.id === replacementId) {
                        // Refresh details view
                        setSelectedFile(null);
                    }
                } catch (err) {
                    triggerToast(`Upload pipeline error: ${err.message}`, "error");
                } finally {
                    setUploading(false);
                    setUploadProgress(0);
                    setReplaceTargetId(null);
                }
            };

            // Delete File Handler
            const handleDeleteFile = async (id, name) => {
                if (useSimulated || apiStatus === 'offline') {
                    const currentMock = JSON.parse(localStorage.getItem('stardive_mock_files') || JSON.stringify(DEMO_FILES));
                    const filtered = currentMock.filter(item => item.id !== id);
                    localStorage.setItem('stardive_mock_files', JSON.stringify(filtered));
                    setFiles(filtered);
                    triggerToast(`Removed construct: ${name}`, "info");
                    if (selectedFile?.id === id) {
                        setSelectedFile(null);
                    }
                    return;
                }

                try {
                    const headers = {};
                    if (apiKey) {
                        headers['Authorization'] = `Bearer ${apiKey}`;
                    }

                    const response = await fetch(`${apiUrl}/v1/files/${id}`, {
                        method: 'DELETE',
                        headers
                    });

                    if (!response.ok) {
                        throw new Error(`Delete failed. Server returned ${response.status}`);
                    }

                    triggerToast(`Deleted ${name} from storage.`, "success");
                    if (selectedFile?.id === id) {
                        setSelectedFile(null);
                    }
                    await fetchFileList();
                } catch (err) {
                    triggerToast(`Error deleting file: ${err.message}`, "error");
                }
            };

            // Format bytes helper
            const formatBytes = (bytes, decimals = 2) => {
                if (!bytes || bytes === 0) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
            };

            // Filter logic based on live search bar input
            const filteredFiles = files.filter(file => {
                const query = searchQuery.toLowerCase();
                return (
                    file.name.toLowerCase().includes(query) ||
                    (file.mime_type && file.mime_type.toLowerCase().includes(query)) ||
                    (file.id && file.id.toLowerCase().includes(query))
                );
            });

            // Calculate overall storage used
            const totalBytesUsed = files.reduce((acc, file) => acc + (file.size_bytes || 0), 0);

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Deep Cosmic Background elements and glow filters */}
                    <div className="fixed inset-0 bg-grid pointer-events-none z-[-2]"></div>
                    <div className="fixed top-[5%] left-[-5%] w-[45%] h-[45%] bg-zinc-800/10 rounded-full blur-[120px] pointer-events-none z-[-1] animate-glow-shift"></div>
                    <div className="fixed bottom-[-5%] right-[-5%] w-[40%] h-[40%] bg-zinc-700/10 rounded-full blur-[100px] pointer-events-none z-[-1] animate-glow-shift" style={{animationDelay: '3s'}}></div>

                    {/* Header */}
                    <Header 
                        config={{ apiUrl, apiKey, useSimulated }} 
                        onOpenSettings={() => setShowSettingsModal(true)} 
                        apiStatus={apiStatus} 
                    />

                    {/* Main Workspace Frame */}
                    <main className="flex-grow pt-28 pb-16 px-4 md:px-12 max-w-7xl mx-auto w-full flex flex-col gap-8">
                        
                        {/* Interactive Banner / Dashboard Intro */}
                        <div className="w-full grid grid-cols-1 lg:grid-cols-3 gap-8 items-center bg-zinc-950/40 border border-zinc-900 rounded-[2rem] p-6 md:p-8 backdrop-blur-xl relative overflow-hidden shadow-2xl">
                            <div className="absolute top-0 right-0 w-24 h-24 bg-white/[0.02] blur-xl rounded-full"></div>
                            
                            {/* Left Text details */}
                            <div className="lg:col-span-2 flex flex-col gap-3">
                                <div className="inline-flex items-center gap-2 px-3 py-1 border border-zinc-800 rounded-full w-fit bg-zinc-900/60 text-[10px] font-mono uppercase tracking-widest text-zinc-400">
                                    <span className="w-1.5 h-1.5 bg-zinc-100 rounded-full animate-ping"></span>
                                    Autonomous Storage Plane
                                </div>
                                <h1 className="text-3xl md:text-4xl font-display font-bold tracking-tight text-white">
                                    System <span className="text-gradient">Space Terminal</span>
                                </h1>
                                <p className="text-sm text-zinc-400 max-w-xl font-light leading-relaxed">
                                    Streamline uploads, verify data hashes, replace active payloads, and view image renders across your cluster directly in your browser. 
                                </p>

                                {/* System stats strip */}
                                <div className="grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-zinc-900/80">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-mono uppercase text-zinc-500">Active Node</span>
                                        <span className="text-xs font-mono font-medium text-zinc-300 truncate" title={apiUrl}>
                                            {useSimulated ? 'Local Sandbox' : apiUrl.replace(/^https?:\/\//, '')}
                                        </span>
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-mono uppercase text-zinc-500">Payload Count</span>
                                        <span className="text-xs font-mono font-medium text-zinc-300">{files.length} active</span>
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-mono uppercase text-zinc-500">Total Volume</span>
                                        <span className="text-xs font-mono font-medium text-zinc-300">{formatBytes(totalBytesUsed)}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Right Isometric illustration */}
                            <div className="hidden lg:block">
                                <IsometricDecorative />
                            </div>
                        </div>

                        {/* Control actions & Upload Box */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Drag & Drop File Upload Panel */}
                            <div className="lg:col-span-1 flex flex-col gap-4">
                                <div className="glass-panel p-6 rounded-[2rem] flex flex-col gap-4 h-full">
                                    <div className="flex justify-between items-center">
                                        <h3 className="font-display font-semibold text-white tracking-tight flex items-center gap-2 text-sm uppercase text-zinc-300">
                                            <Icons.Upload />
                                            Upload Payload
                                        </h3>
                                        {uploading && (
                                            <span className="text-xs font-mono text-zinc-400 animate-pulse">Processing...</span>
                                        )}
                                    </div>

                                    {/* Interactive Drop area */}
                                    <div 
                                        onClick={() => fileInputRef.current?.click()}
                                        className="flex-grow flex flex-col items-center justify-center border border-dashed border-zinc-800 hover:border-zinc-500 rounded-2xl p-6 text-center cursor-pointer bg-zinc-950/20 hover:bg-zinc-900/30 transition-all duration-300 relative group"
                                    >
                                        <input 
                                            type="file" 
                                            ref={fileInputRef} 
                                            onChange={(e) => handleFileUpload(e)}
                                            className="hidden" 
                                        />
                                        
                                        <div className="w-12 h-12 rounded-full border border-zinc-800 bg-zinc-950 flex items-center justify-center text-zinc-400 group-hover:text-white group-hover:border-zinc-500 group-hover:scale-105 transition-all duration-300 mb-4 shadow-lg">
                                            <Icons.Upload />
                                        </div>

                                        <p className="text-xs font-medium text-zinc-300 group-hover:text-white mb-1">Click to browse your device</p>
                                        <p className="text-[10px] text-zinc-500 font-mono">Accepts images, code, binaries & logs</p>
                                        
                                        {/* Dynamic loading progress bar */}
                                        {uploading && (
                                            <div className="absolute inset-0 bg-[#020202]/90 flex flex-col items-center justify-center p-4 rounded-2xl">
                                                <div className="w-12 h-12 rounded-full border-t-2 border-r-2 border-white animate-spin mb-4"></div>
                                                <div className="w-full max-w-[150px] bg-zinc-800 h-1 rounded-full overflow-hidden">
                                                    <div className="bg-white h-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                                                </div>
                                                <p className="text-[10px] font-mono text-zinc-400 mt-2">Uploading: {uploadProgress}%</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Command Line Help Card */}
                                    <div className="bg-zinc-950/60 border border-zinc-900 p-4 rounded-xl flex flex-col gap-2 font-mono text-[11px] text-zinc-400">
                                        <div className="flex items-center gap-1.5 text-[10px] uppercase text-zinc-500 font-bold">
                                            <Icons.Terminal /> Shell Alternative
                                        </div>
                                        <code className="bg-zinc-950 p-2 rounded text-zinc-300 break-all select-all">
                                            curl -F "file=@main.lua" {useSimulated ? 'http://localhost:8080' : apiUrl}/v1/files
                                        </code>
                                    </div>
                                </div>
                            </div>

                            {/* Files Explorer Terminal */}
                            <div className="lg:col-span-2 glass-panel p-6 rounded-[2rem] flex flex-col gap-6">
                                
                                {/* Search and Filtering Header */}
                                <div className="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center">
                                    <div className="relative flex-grow max-w-md">
                                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                                            <Icons.Search />
                                        </span>
                                        <input 
                                            type="text" 
                                            placeholder="Filter constructs by name, ID, or type..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2.5 bg-zinc-950/60 border border-zinc-800 hover:border-zinc-700 focus:border-zinc-500 focus:ring-0 text-xs rounded-xl text-zinc-100 placeholder-zinc-500 font-mono transition-all duration-200"
                                        />
                                        {searchQuery && (
                                            <button 
                                                onClick={() => setSearchQuery('')}
                                                className="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-500 hover:text-white"
                                            >
                                                <Icons.Close />
                                            </button>
                                        )}
                                    </div>

                                    <div className="flex items-center gap-3 self-end sm:self-auto">
                                        {/* List / Grid Toggles */}
                                        <div className="flex items-center bg-zinc-950 rounded-lg p-0.5 border border-zinc-900">
                                            <button 
                                                onClick={() => setViewMode('grid')}
                                                className={`p-1.5 rounded-md transition-all ${viewMode === 'grid' ? 'bg-zinc-800 text-white' : 'text-zinc-500 hover:text-zinc-300'}`}
                                                title="Grid layout"
                                            >
                                                <Icons.Grid />
                                            </button>
                                            <button 
                                                onClick={() => setViewMode('list')}
                                                className={`p-1.5 rounded-md transition-all ${viewMode === 'list' ? 'bg-zinc-800 text-white' : 'text-zinc-500 hover:text-zinc-300'}`}
                                                title="List layout"
                                            >
                                                <Icons.List />
                                            </button>
                                        </div>

                                        {/* Refresh Button */}
                                        <button 
                                            onClick={verifyHealthAndFetch}
                                            disabled={loading}
                                            className="p-2 text-zinc-400 hover:text-white bg-zinc-950 hover:bg-zinc-900 border border-zinc-800 rounded-lg transition-all duration-200 disabled:opacity-50"
                                            title="Sync files"
                                        >
                                            <span className={loading ? 'animate-spin block' : 'block'}><Icons.Refresh /></span>
                                        </button>
                                    </div>
                                </div>

                                {/* Main files catalog list / grid */}
                                {loading ? (
                                    <div className="flex flex-col items-center justify-center py-20 gap-4">
                                        <div className="w-10 h-10 rounded-full border-t-2 border-r-2 border-white animate-spin"></div>
                                        <p className="text-xs font-mono text-zinc-500 tracking-wider">Syncing with cluster storage...</p>
                                    </div>
                                ) : filteredFiles.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center py-16 text-center border border-dashed border-zinc-900 rounded-2xl bg-zinc-950/20">
                                        <div className="w-12 h-12 rounded-full bg-zinc-900/50 flex items-center justify-center text-zinc-600 mb-4">
                                            <Icons.File />
                                        </div>
                                        <h4 className="text-sm font-semibold text-zinc-300">No constructs found</h4>
                                        <p className="text-xs text-zinc-500 mt-1 max-w-xs font-light">Try uploading a new file or configuring a direct cluster API connection.</p>
                                    </div>
                                ) : viewMode === 'grid' ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                                        {filteredFiles.map(file => {
                                            const isImage = file.mime_type && file.mime_type.startsWith('image/');
                                            return (
                                                <div 
                                                    key={file.id}
                                                    onClick={() => setSelectedFile(file)}
                                                    className="glass-panel glass-card-hover rounded-2xl overflow-hidden cursor-pointer flex flex-col group relative"
                                                >
                                                    {/* Preview area */}
                                                    <div className="aspect-[16/10] bg-[#050505] relative overflow-hidden flex items-center justify-center border-b border-zinc-900">
                                                        {isImage ? (
                                                            <img 
                                                                src={file.url || (useSimulated ? file.url : `${apiUrl}/v1/files/${file.id}`)} 
                                                                alt={file.name}
                                                                onError={(e) => {
                                                                    // Show beautiful geometric placeholder if image load fails
                                                                    e.target.style.display = 'none';
                                                                    e.target.nextSibling.style.display = 'flex';
                                                                }}
                                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                                            />
                                                        ) : null}
                                                        
                                                        {/* Generic File Icon view (and fallback if image breaks) */}
                                                        <div className={`absolute inset-0 flex flex-col items-center justify-center p-4 gap-2 text-zinc-500 ${isImage ? 'hidden' : 'flex'}`}>
                                                            <div className="w-10 h-10 rounded-full bg-zinc-900/80 border border-zinc-800 flex items-center justify-center text-zinc-400 group-hover:text-white transition-all">
                                                                {file.name.endsWith('.lua') || file.name.endsWith('.js') || file.name.endsWith('.sh') ? <Icons.Terminal /> : <Icons.FileText />}
                                                            </div>
                                                            <span className="text-[10px] font-mono text-zinc-400 truncate max-w-full">{file.name.split('.').pop().toUpperCase()} FILE</span>
                                                        </div>

                                                        {/* Floating hover view badge */}
                                                        <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity bg-zinc-950/95 backdrop-blur-md border border-zinc-800 p-1.5 rounded-lg text-zinc-300">
                                                            <Icons.Eye />
                                                        </div>
                                                    </div>

                                                    {/* Details body */}
                                                    <div className="p-4 flex flex-col gap-1.5">
                                                        <div className="flex justify-between items-start gap-2">
                                                            <h4 className="text-xs font-semibold text-zinc-200 truncate group-hover:text-white transition-colors" title={file.name}>
                                                                {file.name}
                                                            </h4>
                                                        </div>
                                                        <div className="flex justify-between items-center text-[10px] font-mono text-zinc-500">
                                                            <span>{formatBytes(file.size_bytes)}</span>
                                                            <span className="bg-zinc-900/60 px-2 py-0.5 rounded border border-zinc-800/80 truncate max-w-[100px] text-zinc-400">{file.id}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    /* List Mode */
                                    <div className="flex flex-col gap-2">
                                        <div className="grid grid-cols-12 gap-4 px-4 py-2 text-[10px] font-mono text-zinc-500 uppercase tracking-widest border-b border-zinc-900/60">
                                            <div className="col-span-5">Name</div>
                                            <div className="col-span-3">MIME Type</div>
                                            <div className="col-span-2 text-right">Size</div>
                                            <div className="col-span-2 text-right">ID</div>
                                        </div>
                                        {filteredFiles.map(file => (
                                            <div 
                                                key={file.id}
                                                onClick={() => setSelectedFile(file)}
                                                className="grid grid-cols-12 gap-4 items-center px-4 py-3 bg-zinc-950/20 hover:bg-zinc-900/40 border border-zinc-900 hover:border-zinc-800 rounded-xl cursor-pointer group transition-all"
                                            >
                                                <div className="col-span-5 flex items-center gap-3">
                                                    <div className="text-zinc-500 group-hover:text-white">
                                                        {file.mime_type?.startsWith('image/') ? <Icons.File /> : <Icons.Terminal />}
                                                    </div>
                                                    <span className="text-xs font-semibold text-zinc-300 group-hover:text-white truncate" title={file.name}>
                                                        {file.name}
                                                    </span>
                                                </div>
                                                <div className="col-span-3 text-[11px] font-mono text-zinc-500 truncate">
                                                    {file.mime_type || 'octet-stream'}
                                                </div>
                                                <div className="col-span-2 text-right text-[11px] font-mono text-zinc-400">
                                                    {formatBytes(file.size_bytes)}
                                                </div>
                                                <div className="col-span-2 text-right">
                                                    <span className="text-[10px] font-mono bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800/60 text-zinc-500 group-hover:text-zinc-300">
                                                        {file.id}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                        </div>

                    </main>

                    {/* Custom Alert/Notification System (Embedded Toast) */}
                    {alertMessage && (
                        <div className="fixed bottom-6 right-6 z-50 animate-fade-up max-w-sm">
                            <div className={`p-4 rounded-xl shadow-2xl border backdrop-blur-md flex items-start gap-3 ${
                                alertMessage.type === 'success' ? 'bg-zinc-950/95 border-green-500/30 text-zinc-200' :
                                alertMessage.type === 'warning' ? 'bg-zinc-950/95 border-amber-500/30 text-zinc-200' :
                                alertMessage.type === 'error' ? 'bg-zinc-950/95 border-rose-500/30 text-zinc-200' :
                                'bg-zinc-950/95 border-zinc-800 text-zinc-200'
                            }`}>
                                <div className={`mt-0.5 ${
                                    alertMessage.type === 'success' ? 'text-green-400' :
                                    alertMessage.type === 'warning' ? 'text-amber-400' :
                                    alertMessage.type === 'error' ? 'text-rose-400' :
                                    'text-zinc-400'
                                }`}>
                                    {alertMessage.type === 'success' ? <Icons.Check /> : <Icons.AlertCircle />}
                                </div>
                                <div className="flex-grow flex flex-col gap-0.5">
                                    <span className="text-[10px] font-mono uppercase text-zinc-500">System Notification</span>
                                    <p className="text-xs font-light">{alertMessage.message}</p>
                                </div>
                                <button onClick={() => setAlertMessage(null)} className="text-zinc-500 hover:text-white transition-colors">
                                    <Icons.Close />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Detailed Inspector Modal Panel (Slide-over overlay drawer) */}
                    {selectedFile && (
                        <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm animate-fade-up">
                            <div className="absolute inset-0" onClick={() => setSelectedFile(null)}></div>
                            
                            <div className="relative w-full max-w-lg bg-[#050507] border-l border-zinc-800 h-full shadow-2xl flex flex-col">
                                
                                {/* Inspector Header */}
                                <div className="p-6 border-b border-zinc-900 flex justify-between items-center">
                                    <div className="flex flex-col">
                                        <span className="text-[9px] font-mono text-zinc-500 uppercase tracking-widest">Construct Inspector</span>
                                        <h3 className="text-sm font-semibold text-white font-mono tracking-tight truncate max-w-xs">{selectedFile.name}</h3>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedFile(null)}
                                        className="p-1.5 text-zinc-400 hover:text-white bg-zinc-900 hover:bg-zinc-800 rounded-lg transition-colors"
                                    >
                                        <Icons.Close />
                                    </button>
                                </div>

                                {/* Inspector Content Body */}
                                <div className="flex-grow overflow-y-auto p-6 flex flex-col gap-6">
                                    
                                    {/* Responsive Interactive Preview Block */}
                                    <div className="w-full aspect-video bg-[#020202] rounded-2xl overflow-hidden border border-zinc-900 flex items-center justify-center relative">
                                        {selectedFile.mime_type?.startsWith('image/') ? (
                                            <img 
                                                src={selectedFile.url || (useSimulated ? selectedFile.url : `${apiUrl}/v1/files/${selectedFile.id}`)} 
                                                alt={selectedFile.name}
                                                className="w-full h-full object-contain"
                                            />
                                        ) : selectedFile.content || selectedFile.id === 'file-3b8e' || selectedFile.id === 'file-1f2a' || selectedFile.id === 'file-ec09' ? (
                                            <pre className="w-full h-full p-4 overflow-auto text-[10px] font-mono text-zinc-400 bg-zinc-950 text-left whitespace-pre">
                                                {selectedFile.content || (selectedFile.id === 'file-3b8e' ? DEMO_FILES[1].content : selectedFile.id === 'file-1f2a' ? DEMO_FILES[2].content : DEMO_FILES[4].content)}
                                            </pre>
                                        ) : (
                                            <div className="flex flex-col items-center gap-3 text-zinc-500">
                                                <div className="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">
                                                    <Icons.FileText />
                                                </div>
                                                <span className="text-xs font-mono">No direct view available</span>
                                                <span className="text-[10px] text-zinc-600 font-mono">Standard binary stream</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Action Panel Group */}
                                    <div className="flex flex-col gap-3">
                                        <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">Vault operations</div>
                                        <div className="grid grid-cols-2 gap-3">
                                            {/* Download */}
                                            <a 
                                                href={selectedFile.url || `${apiUrl}/v1/files/${selectedFile.id}`}
                                                download={selectedFile.name}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="flex items-center justify-center gap-2 px-4 py-3 bg-white text-black hover:bg-zinc-200 rounded-xl font-medium text-xs text-center transition-colors"
                                            >
                                                <Icons.Download /> Download File
                                            </a>

                                            {/* PUT payload replacement action */}
                                            <button 
                                                onClick={() => {
                                                    setReplaceTargetId(selectedFile.id);
                                                    replaceInputRef.current?.click();
                                                }}
                                                className="flex items-center justify-center gap-2 px-4 py-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 hover:border-zinc-700 text-zinc-200 rounded-xl font-medium text-xs transition-colors"
                                            >
                                                <Icons.Replace /> Replace Content
                                            </button>
                                            
                                            <input 
                                                type="file" 
                                                ref={replaceInputRef} 
                                                onChange={(e) => handleFileUpload(e, replaceTargetId)}
                                                className="hidden" 
                                            />
                                        </div>
                                    </div>

                                    {/* Meta Attributes Panel */}
                                    <div className="flex flex-col gap-3 bg-zinc-950 border border-zinc-900 p-5 rounded-2xl font-mono text-xs">
                                        <div className="text-[10px] text-zinc-500 uppercase tracking-widest border-b border-zinc-900 pb-2 mb-2">Metadata Attributes</div>
                                        <div className="space-y-3.5">
                                            <div className="flex justify-between">
                                                <span className="text-zinc-500">PAYLOAD ID:</span>
                                                <span className="text-zinc-300">{selectedFile.id}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-zinc-500">MIME CLASSIFIER:</span>
                                                <span className="text-zinc-300 truncate max-w-[200px]" title={selectedFile.mime_type}>{selectedFile.mime_type || 'application/octet-stream'}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-zinc-500">FILE CAPACITY:</span>
                                                <span className="text-zinc-300">{formatBytes(selectedFile.size_bytes)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-zinc-500">COMMIT TIMESTAMP:</span>
                                                <span className="text-zinc-300 truncate max-w-[200px]">{selectedFile.created_at ? new Date(selectedFile.created_at).toLocaleString() : 'Recent Session'}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Danger Zone */}
                                    <div className="mt-auto pt-6 border-t border-zinc-900">
                                        <button 
                                            onClick={() => {
                                                if (confirm(`Confirm deletion of payload ${selectedFile.name}? This action cannot be reversed.`)) {
                                                    handleDeleteFile(selectedFile.id, selectedFile.name);
                                                }
                                            }}
                                            className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-rose-950/20 hover:bg-rose-950/40 border border-rose-900/30 text-rose-300 hover:text-rose-200 rounded-xl font-medium text-xs transition-colors"
                                        >
                                            <Icons.Trash /> Delete from Vault
                                        </button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                    {/* API Settings Modal Dialog */}
                    {showSettingsModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-up">
                            <div className="absolute inset-0" onClick={() => setShowSettingsModal(false)}></div>
                            
                            <div className="relative w-full max-w-lg bg-[#0a0a0c] border border-zinc-800 rounded-[2.5rem] overflow-hidden p-6 md:p-8 shadow-2xl flex flex-col gap-6">
                                
                                <div className="flex justify-between items-start">
                                    <div className="flex items-center gap-2">
                                        <div className="w-8 h-8 rounded-full border border-zinc-700 bg-zinc-900 flex items-center justify-center text-zinc-300">
                                            <Icons.Settings />
                                        </div>
                                        <h3 className="font-display font-semibold text-white text-md tracking-tight">Vault Connection Setup</h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowSettingsModal(false)}
                                        className="p-1.5 text-zinc-400 hover:text-white bg-zinc-900 rounded-lg"
                                    >
                                        <Icons.Close />
                                    </button>
                                </div>

                                <div className="flex flex-col gap-4 text-xs font-mono">
                                    
                                    {/* Simulator Toggle Mode */}
                                    <div className="bg-zinc-950 p-4 border border-zinc-900 rounded-xl flex items-center justify-between gap-4">
                                        <div className="flex flex-col gap-1">
                                            <span className="text-zinc-200 font-semibold uppercase text-[10px]">Use Local Simulated Sandbox</span>
                                            <p className="text-[11px] text-zinc-500 font-light font-sans leading-normal">Runs completely on simulated state. Switch this off to connect your live Rust stardive-api endpoint directly.</p>
                                        </div>
                                        <button 
                                            onClick={() => setUseSimulated(!useSimulated)}
                                            className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${useSimulated ? 'bg-zinc-300' : 'bg-zinc-800'}`}
                                        >
                                            <span className={`inline-block h-4 w-4 transform rounded-full bg-black transition-transform ${useSimulated ? 'translate-x-6' : 'translate-x-1'}`} />
                                        </button>
                                    </div>

                                    {/* API Endpoint Input Field */}
                                    <div className="flex flex-col gap-2">
                                        <label className="text-zinc-500 uppercase text-[10px]">stardive-api Base URL Address</label>
                                        <input 
                                            type="text"
                                            value={apiUrl}
                                            onChange={(e) => setApiUrl(e.target.value)}
                                            disabled={useSimulated}
                                            placeholder="e.g. http://localhost:8080 or https://api.stardive.space"
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-900 rounded-xl text-zinc-300 text-xs tracking-wide focus:border-zinc-500 disabled:opacity-40 font-mono"
                                        />
                                    </div>

                                    {/* Security API Key Input Field */}
                                    <div className="flex flex-col gap-2">
                                        <label className="text-zinc-500 uppercase text-[10px] flex items-center gap-1.5">
                                            STARDIVE_API_KEY Token <span className="text-[9px] text-zinc-600 font-normal lowercase">(optional)</span>
                                        </label>
                                        <input 
                                            type="password"
                                            value={apiKey}
                                            onChange={(e) => setApiKey(e.target.value)}
                                            disabled={useSimulated}
                                            placeholder="Enforces authorization headers if API is locked"
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-900 rounded-xl text-zinc-300 text-xs tracking-wide focus:border-zinc-500 disabled:opacity-40 font-mono"
                                        />
                                    </div>

                                    {/* Dynamic Check Output details */}
                                    <div className="text-[10px] text-zinc-600 bg-zinc-950/40 p-3.5 border border-zinc-900 rounded-xl">
                                        <span className="text-zinc-500 uppercase font-bold">Health Response Status:</span>
                                        <div className="mt-1 flex justify-between">
                                            <span>Target health checked:</span>
                                            <span className="text-zinc-400 font-bold">{apiHealth.checkedAt || 'Never'}</span>
                                        </div>
                                        <div className="mt-1 flex justify-between">
                                            <span>Current system route:</span>
                                            <span className={`font-bold ${apiHealth.up ? 'text-green-400' : 'text-rose-400'}`}>{apiHealth.up ? 'ONLINE/OK' : 'OFFLINE/UNREACHABLE'}</span>
                                        </div>
                                        {apiHealth.error && <p className="text-rose-400 mt-1 truncate">Error details: {apiHealth.error}</p>}
                                    </div>

                                </div>

                                <div className="flex gap-3 justify-end mt-2">
                                    <button 
                                        onClick={() => setShowSettingsModal(false)}
                                        className="px-6 py-3 border border-zinc-800 text-zinc-400 hover:text-white rounded-full text-xs transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => saveSettings(apiUrl, apiKey, useSimulated)}
                                        className="px-6 py-3 bg-white text-black hover:bg-zinc-200 rounded-full text-xs font-semibold transition-colors"
                                    >
                                        Apply Settings
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-auto relative z-10 py-10 bg-[#020202]">
                        <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-zinc-800/40 to-transparent"></div>
                        <div className="max-w-7xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-3">
                                <div className="w-5 h-5 rounded-full border border-zinc-700/80 flex items-center justify-center bg-zinc-900 shadow-inner"></div>
                                <span className="font-display font-bold tracking-[0.2em] text-xs text-zinc-300">STARDIVE SYSTEMS</span>
                            </div>
                            
                            <div className="text-[10px] font-mono text-zinc-600 tracking-wider">
                                &copy; 2026 STARDIVE. Licensed for secure spatial database interactions.
                            </div>
                            
                            <div className="flex gap-6 text-xs text-zinc-500 font-medium">
                                <a href="#" className="hover:text-white transition-all">Twitter</a>
                                <a href="#" className="hover:text-white transition-all">GitHub</a>
                                <a href="#" className="hover:text-white transition-all">Discord</a>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
